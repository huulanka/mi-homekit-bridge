[project]
name = "mi-homekit-bridge"
version = "0.1.0"
description = "Tiny bridge that exposes Xiaomi LYWSD03MMC and BTHome BLE thermometers to Apple HomeKit"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "hulanka" }]
keywords = ["homekit", "bluetooth", "ble", "xiaomi", "lywsd03mmc", "bthome", "raspberry-pi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: No Input/Output (Daemon)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.5,<4",
    "bleak>=3.0.2,<4",
    "bthome-ble>=3.25.0,<4",
    "habluetooth>=7.1.2,<8",
    "hap-python[qrcode]>=5.0.0,<6",
    "xiaomi-ble>=1.21.2,<2",
]

[project.urls]
Homepage = "https://github.com/huulanka/mi-homekit-bridge"
Issues = "https://github.com/huulanka/mi-homekit-bridge/issues"

[project.scripts]
mi-homekit-bridge = "mi_homekit_bridge.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# HAP-python ships without type hints.
module = ["pyhap.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mi_homekit_bridge.homekit"]
disallow_subclassing_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
